
name: Build Arrow Solver APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ArrowSolver_Android_Phone_Build_Kit.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o ArrowSolver_Android_Phone_Build_Kit.zip -d extracted

      - name: Build APK
        working-directory: extracted/ArrowSolverPrototype
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ArrowSolver-debug-apk
          path: extracted/ArrowSolverPrototype/app/build/outputs/apk/debug/app-debug.apk
